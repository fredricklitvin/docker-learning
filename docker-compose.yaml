version: "3.9"

services:
  frontend:
    image: nginx:latest
    ports:
      - "8080:80"
    restart: always
    volumes:
      - ./nginx-conf/index.html:/usr/share/nginx/html/index.html 
      - ./nginx-conf/nginx.conf:/etc/nginx/nginx.conf 
    depends_on:
      - app

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    restart: always

    

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: mydatabase
        POSTGRES_HOST: db
        POSTGRES_PORT: 5432
    depends_on:
      - db
    restart: always